name: Rebuild Bitaqati standalone page
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'build-standalone.py'
      - '.github/workflows/rebuild-standalone.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone page
        run: python build-standalone.py
      - name: Commit generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html SOURCE-SHA256.json
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild standalone site from updated dist sources"
            git push
          fi
